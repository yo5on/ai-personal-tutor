name: One-time dependency security refresh

on:
  push:
    branches:
      - security/ai-tutor-dependency-refresh

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install current lockfile
        run: npm ci
      - name: Update vulnerable Next.js and its matching ESLint config
        run: npm install --save-exact next@16.4.3 eslint-config-next@16.4.3
      - name: Apply non-breaking security fixes
        run: npm audit fix
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Record remaining advisories
        run: npm audit --omit=dev
      - name: Commit tested dependency lockfile and remove this one-time workflow
        run: |
          rm .github/workflows/refresh-deps.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/refresh-deps.yml
          git commit -m "security: update Next.js and patched dependencies"
          git push origin HEAD:security/ai-tutor-dependency-refresh
